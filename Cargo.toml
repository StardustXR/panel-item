[package]
name = "stardust-xr-panel-item"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["asteroids"]

[workspace.dependencies]
gluon = { git = "https://github.com/technobaboo/gluon", branch = "refactor/strongipc" }
mint = "0.5.9"
tracing = "0.1.44"

[dependencies]
stardust-xr-fusion = { git = "https://github.com/StardustXR/core", branch = "refactor/strongipc" }
stardust-xr-protocol = { git = "https://github.com/StardustXR/core", branch = "refactor/strongipc" }
tokio = { version = "1.49.0", features = ["sync"] }
gluon.workspace = true
mint.workspace = true
tracing.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }

[build-dependencies]
stardust-xr-protocol = { git = "https://github.com/StardustXR/core", branch = "refactor/strongipc" }
syn = "2"
prettyplease = "0.2"
gluon-parser = { git = "https://github.com/technobaboo/gluon", branch = "refactor/strongipc" }
gluon-codegen = { git = "https://github.com/technobaboo/gluon", branch = "refactor/strongipc" }

[features]
serde = ["dep:serde", "stardust-xr-protocol/serde"]
