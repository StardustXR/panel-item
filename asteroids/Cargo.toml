[package]
name = "stardust-xr-panel-item-asteroids"
version = "0.52.0"
edition = "2024"

authors = ["Nova King <technobaboo@proton.me>"]
description = "Asteroids declarative UI for panel shells"
license = "MIT"
repository = "https://github.com/StardustXR/panel-item/"
